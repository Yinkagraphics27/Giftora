<!DOCTYPE html>
<html>
<head>
    <title>Get JWT Token</title>
</head>
<body>
    <h1>Login to Get JWT Token</h1>
    <p>Email: oadebanjo75@gmail.com</p>
    <input id="password" placeholder="Password" type="password">
    <button onclick="login()">Login</button>
    <pre id="result"></pre>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

        const supabase = createClient(
            'https://iaoriuznuyppshgujnrw.supabase.co',
            'sb_publishable_rKER7dN-5w5Ut8NnO0szSg_1GSl0tm5'
        )

        window.login = async function() {
            const password = document.getElementById('password').value

            if (!password) {
                document.getElementById('result').textContent = 'Please enter a password'
                return
            }

            const { data, error } = await supabase.auth.signInWithPassword({
                email: 'oadebanjo75@gmail.com',
                password: password
            })

            if (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message
                return
            }

            document.getElementById('result').textContent = 'JWT Token:\n' + data.session.access_token
        }
    </script>
</body>
</html>
