<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== Primary SEO Meta Tags ===== -->
    <title>Giftora - Premium Global Gift Marketplace | Gift Boxes, Hampers & Custom Gifts</title>
    <meta name="description" content="Shop premium gift boxes, hampers, corporate gifts, and customized presents from trusted vendors in Nigeria, Dubai, UK & US. Fast delivery, global shipping, and unique gift ideas for every occasion." />
    <meta name="keywords" content="gift marketplace, gift boxes, hampers, corporate gifts, customized gifts, souvenirs, premium gifts, global gifts, gift delivery Nigeria, gift delivery Dubai, gift delivery UK, gift delivery US, birthday gifts, wedding gifts, anniversary gifts" />
    <meta name="author" content="Giftora" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://giftora.com/" />

    <!-- ===== Language & Locale ===== -->
    <meta http-equiv="content-language" content="en" />
    <meta name="geo.region" content="NG" />
    <meta name="geo.placename" content="Lagos, Nigeria" />

    <!-- ===== Open Graph / Facebook / WhatsApp / LinkedIn ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Giftora" />
    <meta property="og:title" content="Giftora - Premium Global Gift Marketplace" />
    <meta property="og:description" content="Shop premium gift boxes, hampers, corporate gifts, and customized presents from trusted vendors worldwide." />
    <meta property="og:url" content="https://giftora-88a2.onrender.com/" />
    <meta property="og:image" content="https://giftora-88a2.onrender.com/hjuy.png" />
    <meta property="og:image:secure_url" content="https://giftora-88a2.onrender.com/hjuy.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Giftora - Premium Global Gift Marketplace" />
    <meta property="og:locale" content="en_US" />

    <!-- ===== Twitter Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Giftora" />
    <meta name="twitter:creator" content="@Giftora" />
    <meta name="twitter:title" content="Giftora - Premium Global Gift Marketplace" />
    <meta name="twitter:description" content="Shop premium gift boxes, hampers, corporate gifts, and customized presents from trusted vendors worldwide." />
    <meta name="twitter:image" content="https://giftora-88a2.onrender.com/hjuy.png" />
    <meta name="twitter:image:alt" content="Giftora - Premium Global Gift Marketplace" />

    <!-- ===== Structured Data (JSON-LD) for Google Rich Results ===== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "Giftora",
      "alternateName": "Giftora Gift Marketplace",
      "url": "https://giftora-88a2.onrender.com/",
      "logo": "https://giftora-88a2.onrender.com/hjuy.png",
      "image": "https://giftora-88a2.onrender.com/hjuy.png",
      "description": "Premium global gift marketplace offering gift boxes, hampers, corporate gifts, and customized presents from trusted vendors worldwide.",
      "sameAs": [
        "https://twitter.com/Giftora",
        "https://www.instagram.com/Giftora",
        "https://www.facebook.com/Giftora"
      ],
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://giftora-88a2.onrender.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "support@giftora.com",
        "availableLanguage": ["English"]
      }
    }
    </script>

    <!-- ===== Fonts ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- ===== Favicon (add your own favicon in /public) ===== -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
